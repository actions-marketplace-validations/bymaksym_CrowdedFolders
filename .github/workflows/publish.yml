name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  # npm trusted publishing (OIDC) and provenance: no token is stored anywhere.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm, registry-url: https://registry.npmjs.org }
      - run: pnpm install --frozen-lockfile
      - name: The tag is the version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json $version"
            exit 1
          fi
      - name: The executable has no CR (the shebang breaks with one)
        run: |
          if grep -qU $'\r' bin/crowded-folders.js; then
            echo "::error::bin/crowded-folders.js has CR line endings"
            exit 1
          fi
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run package:lint
      - run: pnpm run test:package
      # If the version is already on npm this fails, which is the point: a release that publishes
      # nothing must not look like a success.
      - run: pnpm publish --access public --no-git-checks --provenance
      # Last, and only once npm has it: an announcement for something nobody can install yet is a
      # promise. The post is built by .github/scripts/announce-release.py, the same file every public
      # repo of ByMaksymDev Labs carries. Discord failing must not turn a good publish red, hence
      # continue-on-error. Without the secret it only prints.
      - name: Announce on Discord
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ROLE_ID: ${{ vars.DISCORD_RELEASES_ROLE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          APP: crowded-folders
          COLOR: '2664576'
          ICON: https://raw.githubusercontent.com/bymaksym/CrowdedFolders/main/.github/logo.png
          FOOTER: npm · crowded-folders
        run: python3 .github/scripts/announce-release.py
